# ============================================================
# NGINX — Configurazione per app-gestionale (Aruba)
# ============================================================
# Posiziona questo file in: /etc/nginx/sites-available/gestionale
# Poi: ln -s /etc/nginx/sites-available/gestionale /etc/nginx/sites-enabled/
# Sostituisci TUO_DOMINIO.it con il dominio reale
# ============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name TUO_DOMINIO.it www.TUO_DOMINIO.it;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS principale
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name TUO_DOMINIO.it www.TUO_DOMINIO.it;

    # ── Certificati SSL (Let's Encrypt via Certbot) ──────────
    ssl_certificate     /etc/letsencrypt/live/TUO_DOMINIO.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TUO_DOMINIO.it/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/TUO_DOMINIO.it/chain.pem;

    # Configurazione SSL sicura (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;

    # ── Security Headers ─────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Logging ──────────────────────────────────────────────
    access_log /var/log/nginx/gestionale.access.log;
    error_log  /var/log/nginx/gestionale.error.log warn;

    # ── Limite dimensione upload (per documenti PDF) ──────────
    client_max_body_size 20M;

    # ── API Backend (Node.js su porta 5000) ──────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout generosi per operazioni AdE/A-Cube (possono essere lente)
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ── Frontend React (build statica) ───────────────────────
    root /var/www/gestionale/client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Cache per asset statici con hash nel nome
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Blocca accesso a file sensibili ──────────────────────
    location ~ /\. {
        deny all;
    }
    location ~ \.(env|log|sh|md)$ {
        deny all;
    }
}
